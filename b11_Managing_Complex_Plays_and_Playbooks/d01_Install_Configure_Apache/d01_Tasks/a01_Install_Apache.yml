---
# d01_Tasks/a01_Install_Apache.yml
## Starts and enables the service

- name: Install Apache (httpd)
  ansible.builtin.package:
    name: httpd
    state: present
    update_cache: yes

- name: Enable and start Apache service
  ansible.builtin.service:
    name: httpd
    state: started
    enabled: true #####################################


