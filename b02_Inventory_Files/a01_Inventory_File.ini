# This assignment introduces Ansible static inventories, 
# custom ports and users, 
# host ranges, 
# and viewing inventory using ansible-navigator in stdout mode for hands-on understanding.

# Create a static inventory file with a group named web and add two hosts.
[web]
webserver1
webserver2
webserver3    ansible_port=2222
webserver4    ansible_user=admin
web[01:05]

# Add one host with a custom SSH port (2222).
# Add another host with a custom SSH user (admin).
# Use a host range to define web1 to web5.
# Use ansible-navigator to view your inventory in stdout mode.
