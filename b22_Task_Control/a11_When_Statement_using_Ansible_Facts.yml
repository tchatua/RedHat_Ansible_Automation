---
- name: Package installation with When Statement
  hosts: dev
  become: true

  vars:
    my_service: apache2

  tasks:
    - name: "{{ my_service }} package installation"
      ansible.builtin.apt: 
        name: "{{ my_service }}"
        state: latest
      # when: > 
      #   (ansible_distribution == "Ubuntu" and ansible_distribution_version is version('22.04', '==')) 
      #   or 
      #   (ansible_distribution == "CentOS" and ansible_distribution_version == "8")
      # when: >
      #   (ansible_facts['os_family'] == "Debian" and ansible_distribution_major_version == "22")
      #   or
      #   (ansible_facts['os_family'] == "RedHat" and ansible_distribution_major_version == "8")
      when: "ansible_memfree_mb > 1000"
