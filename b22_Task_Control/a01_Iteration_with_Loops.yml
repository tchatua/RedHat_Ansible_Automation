---
- name: Install and start Apache and FTP services
  hosts: dev
  become: true

  vars:
    apache_service: apache2
    ftp_service: vsftpd
    packages:
      - apache2
      - vsftpd

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name: "{{ packages }}"
        state: present
        update_cache: true
        
    - name: Ensure Apache and FTP services are running and enabled
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - "{{ apache_service }}"
        - "{{ ftp_service }}"
